<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Air780E 配网</title><link rel="icon" href="data:,">
<style>:root{font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;color:#18352d;background:#f4f7f5}*{box-sizing:border-box}main{max-width:440px;margin:8vh auto;padding:26px;background:white;border:1px solid #e0e7e2;border-radius:14px}h1{font-size:22px;margin:0 0 20px}label{display:block;font-size:13px;margin:16px 0 5px;color:#596e60}input{font:inherit;width:100%;padding:10px 12px;border:1px solid #d6e1d9;border-radius:8px}button{font:inherit;background:#226845;color:white;border:0;border-radius:9px;padding:10px 18px;margin-top:24px;width:100%;cursor:pointer}button:disabled{opacity:.5}#result{white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:0}@media(max-width:480px){main{margin:20px 16px}}</style>
<main><h1>连接 Wi-Fi</h1><form id="form"><label for="ssid">Wi-Fi 名称（2.4 GHz）</label><input id="ssid" required autocomplete="off"><label for="password">Wi-Fi 密码</label><input id="password" type="password" autocomplete="new-password" placeholder="无密码网络请留空"><label id="keyLabel" for="key">访问密钥</label><input id="key" type="password" required autocomplete="off"><button id="save" disabled>保存并连接</button></form><p id="result" role="status">正在读取配置…</p></main>
<script>
const $=id=>document.getElementById(id);
async function request(data){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{const r=await fetch('/api/provision',{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined,signal:controller.signal});const v=await r.json();if(!r.ok)throw Error(v.error||'保存失败');return v}catch(e){if(e.name==='AbortError')throw Error('连接超时，请重新连接热点后刷新');throw e}finally{clearTimeout(timer)}}
request().then(s=>{$('ssid').value=s.ssid||'';$('keyLabel').textContent=s.has_key?'现有访问密钥':'设置访问密钥';$('key').placeholder=s.has_key?'填写当前面板访问密钥':'设置用于打开面板的密钥';$('result').textContent='';$('save').disabled=false}).catch(e=>{$('result').textContent=e.message});
$('form').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;$('result').textContent='正在保存…';try{await request({ssid:$('ssid').value,password:$('password').value,access_key:$('key').value});$('password').value=$('key').value='';$('form').hidden=true;$('result').textContent='已保存，设备正在重启。请连接同一个 Wi-Fi，在路由器中查看设备地址并打开面板。'}catch(e){$('result').textContent=e.message;$('save').disabled=false}};
</script></html>
